services:
  postgres:
    image: postgres:16
    container_name: viboo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: viboo_user
      POSTGRES_PASSWORD: viboo_password
      POSTGRES_DB: viboo_db

    ports:
      - "5432:5432"

    volumes:
      - viboo_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viboo_user -d viboo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: viboo-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@viboo.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    volumes:
      - viboo_pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  viboo_postgres_data:
  viboo_pgadmin_data:
